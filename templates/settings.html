{% extends "base.html" %}

{% block title %}Paramètres - SubManager{% endblock %}

{% block content %}
<div class="settings-page">
    <div class="page-header">
        <h1><i class="fas fa-cog"></i> Paramètres</h1>
        <p>Gérez vos préférences de compte et de notification</p>
    </div>

    <form method="POST" action="{{ url_for('update_notifications') }}" class="settings-form">
        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="emailNotifications" name="email_notifications"
                   {% if user.email_notifications %}checked{% endif %}>
            <label class="form-check-label" for="emailNotifications">
                Recevoir des notifications par email
            </label>
        </div>

        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="renewalReminders" name="renewal_reminders"
                   {% if user.renewal_reminders %}checked{% endif %}>
            <label class="form-check-label" for="renewalReminders">
                Recevoir des rappels avant les renouvellements
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Sauvegarder les préférences
        </button>
    </form>
</div>
{% endblock %}
