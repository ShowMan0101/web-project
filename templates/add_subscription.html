{% extends "base.html" %}

{% block title %}Ajouter un abonnement - SubManager{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-plus-circle me-2"></i> Nouvel Abonnement</h1>
        <a href="{{ url_for('subscriptions') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
    </div>

    <form method="POST" action="{{ url_for('add_subscription') }}" class="card p-4 shadow-sm">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="service_name" class="form-label">Nom du service</label>
                <input type="text" class="form-control" id="service_name" name="service_name" placeholder="ex: Netflix" required>
            </div>

            <div class="col-md-6">
                <label for="category" class="form-label">Catégorie</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" selected disabled>Choisir une catégorie</option>
                    <option value="Streaming">Streaming</option>
                    <option value="Musique">Musique</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Cloud">Cloud</option>
                    <option value="Finance">Finance</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="start_date" class="form-label">Date de début</label>
                <input type="date" class="form-control" id="start_date" name="start_date" required>
            </div>

            <div class="col-md-6">
                <label for="renewal_date" class="form-label">Date de renouvellement</label>
                <input type="date" class="form-control" id="renewal_date" name="renewal_date" required>
            </div>

            <div class="col-md-6">
                <label for="monthly_cost" class="form-label">Coût mensuel (€)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="monthly_cost" name="monthly_cost" placeholder="ex: 9.99" required>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-success w-100">
                    <i class="fas fa-check-circle me-1"></i> Enregistrer
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
