{% extends "base.html" %}

{% block title %}Mon Profil - SubManager{% endblock %}

{% block content %}
<div class="profile-page">
    <div class="profile-container">
        <div class="profile-header">
            <h1>Mon Profil</h1>
            <p>Gérez vos informations personnelles</p>
        </div>



        <div class="profile-content">
            <div class="profile-section">
                <h2>Informations personnelles</h2>
                <form method="POST" action="{{ url_for('update_profile') }}" class="profile-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ user.email }}" readonly
                            class="form-control">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">Prénom</label>
                            <input type="text" id="firstname" name="firstname" value="{{ user.firstname }}"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="lastname">Nom</label>
                            <input type="text" id="lastname" name="lastname" value="{{ user.lastname }}"
                                class="form-control">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        Sauvegarder les modifications
                    </button>
                </form>
            </div>

            <div class="profile-section">
                <h2>Sécurité</h2>
                <form method="POST" action="{{ url_for('change_password') }}" class="profile-form">
                    <div class="form-group">
                        <label for="current_password">Mot de passe actuel</label>
                        <input type="password" id="current_password" name="current_password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="new_password">Nouveau mot de passe</label>
                        <input type="password" id="new_password" name="new_password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirmer le nouveau mot de passe</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-lock"></i>
                        Changer le mot de passe
                    </button>
                </form>
            </div>


            <div class="profile-section danger-zone">
                <h2>Zone de danger</h2>
                <p>Attention : ces actions sont irréversibles</p>

                <button class="btn btn-danger" onclick="confirmDeleteAccount()">
                    <i class="fas fa-trash-alt"></i>
                    Supprimer mon compte
                </button>
            </div>
        </div>
    </div>
</div>



<script>
    function confirmDeleteAccount() {
        if (confirm('Êtes-vous sûr de vouloir supprimer votre compte ? Cette action est irréversible.')) {
            // Envoyer la requête de suppression
            window.location.href = "{{ url_for('delete_account') }}";
        }
    }
</script>
{% endblock %}
