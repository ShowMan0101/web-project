{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Connexion</h2>
                <p>Bienvenue sur SubManager</p>
            </div>

            <!-- Ajout de la méthode et de l'action dans le formulaire -->
            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" name="email" required class="form-control" placeholder="Votre email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required class="form-control"
                            placeholder="Votre mot de passe">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    Se connecter
                </button>
            </form>

            <div class="auth-footer">
                <p>Pas encore de compte ?</p>
                <a href="{{ url_for('register') }}" class="btn btn-outline">
                    Créer un compte
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
