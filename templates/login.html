{% extends "base.html" %}

{% block title %}Connexion - SubManager{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h2 class="text-center mb-3">
                <i class="fas fa-sign-in-alt me-2"></i> Connexion
            </h2>
            <p class="text-muted text-center mb-4">Bienvenue sur SubManager</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-1"></i> Email
                    </label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="exemple@mail.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-1"></i> Mot de passe
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Votre mot de passe" required>
                        <span class="input-group-text bg-white">
                            <i class="fas fa-eye toggle-password" style="cursor:pointer;" onclick="togglePassword('password')"></i>
                        </span>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-1"></i> Se connecter
                    </button>
                </div>

                <div class="text-center">
                    <a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a>
                </div>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0">
                Pas encore de compte ?
                <a href="{{ url_for('register') }}" class="text-decoration-none">
                    S'inscrire
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
