{% extends "base.html" %}
{% block title %}Modifier un abonnement - SubManager{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-edit me-2"></i> Modifier l'abonnement</h1>
        <a href="{{ url_for('subscriptions') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
    </div>

    <form method="POST" class="card p-4 shadow-sm">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="service_name" class="form-label">Nom du service</label>
                <input type="text" class="form-control" id="service_name" name="service_name"
                       value="{{ subscription.service_name }}" required>
            </div>

            <div class="col-md-6">
                <label for="category" class="form-label">Catégorie</label>
                <select class="form-select" id="category" name="category" required>
                    {% set categories = ['Streaming', 'Musique', 'Gaming', 'Cloud', 'Finance', 'Autre'] %}
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if subscription.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label for="start_date" class="form-label">Date de début</label>
                <input type="date" class="form-control" id="start_date" name="start_date"
                       value="{{ subscription.start_date }}" required>
            </div>

            <div class="col-md-6">
                <label for="renewal_date" class="form-label">Date de renouvellement</label>
                <input type="date" class="form-control" id="renewal_date" name="renewal_date"
                       value="{{ subscription.renewal_date }}" required>
            </div>

            <div class="col-md-6">
                <label for="monthly_cost" class="form-label">Coût mensuel (€)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="monthly_cost" name="monthly_cost"
                       value="{{ "%.2f"|format(subscription.monthly_cost) }}" required>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-success w-100">
                    <i class="fas fa-save me-1"></i> Enregistrer les modifications
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
