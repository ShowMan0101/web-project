{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Créer un compte</h2>
                <p>Rejoignez SubManager</p>
            </div>

            <!-- Ajout de la méthode et de l'action dans le formulaire -->
            <form method="POST" action="{{ url_for('register') }}" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" name="email" required class="form-control" placeholder="Votre email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required class="form-control"
                            placeholder="Créez un mot de passe" minlength="8">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        <i class="fas fa-lock"></i>
                        Confirmer le mot de passe
                    </label>
                    <div class="password-input">
                        <input type="password" id="confirm_password" name="confirm_password" required
                            class="form-control" placeholder="Confirmez votre mot de passe">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('confirm_password')"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i>
                    S'inscrire
                </button>
            </form>

            <div class="auth-footer">
                <p>Déjà un compte ?</p>
                <a href="{{ url_for('login') }}" class="btn btn-outline">
                    Se connecter
                </a>
            </div>
        </div>
    </div>
</div>


<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;

        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Validation du formulaire
    document.querySelector('.auth-form').addEventListener('submit', function (e) {
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');

        if (confirmPassword && password.value !== confirmPassword.value) {
            e.preventDefault();
            alert('Les mots de passe ne correspondent pas !');
        }
    });
</script>
{% endblock %}
